common:
  # PKI approaches are specified with the following keys:
  # Set sgctl_certificates_enabled to true if the certificates should be self-signed and generated by the SG TLS tool
  sgctl_certificates_enabled: false
  # Set ca_certificates_enabled to true to sign all node and service certificates with your own CA.
  # The CA files (crt.pem and key.pem) are read from the "ca" subfolder of certificates_directory.
  ca_certificates_enabled: true
  # Password of the CA private key (key.pem); omit or leave empty if the key is not encrypted
  ca_password: passca222
  # Directory (relative to the chart root) that contains the "ca" subfolder with crt.pem and key.pem
  certificates_directory: "examples/common/setup_custom_ca/secrets"