workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
    
.common-config: &common-config
 - |
   git config --global user.name "${GITLAB_USER_NAME}"
   git config --global user.email "${GITLAB_USER_EMAIL}"  
   chart_file="Chart.yaml"
   chart_name=$(grep '^name:' Chart.yaml | awk '{print $2}')
   helm_user="helm"
   helm_repo_name="search-guard-flx-helm-charts"

   if [[ -z "${CI_PROJECT_ID}" ]]; then
     helm_project_id=261
   else
     helm_project_id="${CI_PROJECT_ID}"
   fi
      
   if [[ -z "${CI_SERVER_HOST}" ]]; then
    server_host=git.floragunn.com
   else
    server_host="${CI_SERVER_HOST}"
   fi
            
   helm_channel=stable
   helm_repo_url=https://${server_host}/api/v4/projects/$helm_project_id/packages/helm/$helm_channel 
   git remote set-url origin https://helm:$access_token@${server_host}/${CI_PROJECT_PATH}.git
   chart_version=$(grep '^version:' $chart_file | awk -F ': ' '{print $2}')
   if [ ! -f "$chart_file" ]; then
    echo "[ERROR] Chart file $chart_file not exist"
    exit 1
   fi 
   if helm repo list | grep -q "$helm_repo_name"; then
     helm repo remove $helm_repo_name
   fi    
          
   helm repo add --username $helm_user --password $access_token $helm_repo_name  $helm_repo_url
   helm repo update
           
      
image: 
  name: alpine/helm:3.18.3
  entrypoint: [""]   
  

variables:
  GIT_STRATEGY: clone   
  
stages:
  - Validate
  - Publish
  - Test

validate_helm:
  tags:
    - build    
  stage: Validate
  script:

    - |
      set -e
      if ! helm template . > /dev/null 2>&1; then
          echo "[ERROR] Helm template cannot be rendered for default values"
          exit 1      
      fi
      for custom_value in $(find examples -name values.yaml) ; do
        if ! helm template . -f $custom_value > /dev/null 2>&1; then
          echo "[ERROR] Helm template cannot be rendered with $custom_value values"
          exit 1
        fi
      done
      echo "[INFO] Validation completed successfully"

validate_release:
  tags:
    - build  
  stage: Validate
  script:
    - *common-config  
    - |
      set -e
      if git tag -l | grep -q "^$chart_version$"; then
        echo "[ERROR] Tag for version $chart_version already exist"
        exit 1
      fi
      
      chart_exist=$(helm search repo  $helm_repo_name -o json --version $chart_version) 
      if [ ! "$chart_exist" == "[]" ]; then
       echo "[ERROR] Version $chart_version already exist in $helm_repo_url"
      fi
      
      echo "[INFO] Validation completed successfully"
publish_helm:
  needs:
    - validate_helm  
    - validate_release
  only:
    - main
  tags:
    - build  
  stage: Publish
  script:
    - *common-config  
    - |
      set -e
      if ! helm plugin list | grep -q "cm-push"; then
        helm plugin install https://github.com/chartmuseum/helm-push
      fi
      echo "[INFO] Executing helm package"
      helm package .  
      echo "[INFO] Executing helm cm-push"
      helm cm-push  $chart_name-$chart_version.tgz $helm_repo_name
      echo "[INFO] Published $chart_version version for $helm_repo_name"
                      
      git tag "$chart_version-flx"
      git push origin $chart_version-flx    
      echo "[INFO] Published tags"
      echo "[INFO] Completed successfully"

integration_minikube:
  stage: Test
  tags:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    MINIKUBE_PROFILE: "multinode"
    MINIKUBE_K8S_VERSION: "v1.34.1"
    TEST_NS: "integtests"
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  image:
    name: alpine/helm:3.18.3
    entrypoint: [""]
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  script:
    - |
      set -euo pipefail
      apk add --no-cache bash curl tar gzip procps docker-cli ca-certificates

      # minikube (latest stable) - required for tests/prepare_minikube.sh
      if ! command -v minikube >/dev/null 2>&1; then
        curl -sLo /usr/local/bin/minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        chmod +x /usr/local/bin/minikube
      fi

      # kubectl might not exist in the base image; install if missing.
      if ! command -v kubectl >/dev/null 2>&1; then
        KUBECTL_VERSION="$(curl -s https://dl.k8s.io/release/stable.txt)"
        curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        chmod +x /usr/local/bin/kubectl
      fi

      # Ensure minikube uses docker driver inside GitLab DinD.
      minikube config set driver docker -p "$MINIKUBE_PROFILE"

      # Start cluster and align kubectl context with what install.sh expects.
      ./tests/prepare_minikube.sh "$MINIKUBE_K8S_VERSION"
      kubectl config use-context "$MINIKUBE_PROFILE"

      # Run integration tests; $2=false skips update_es_kb_version.
      ./tests/run_tests.sh "" false
  after_script:
    - |
      echo "[INFO] Integration test diagnostics"
      kubectl config current-context || true
      helm status sg-elk -n "$TEST_NS" || true
      kubectl get pods -A || true


