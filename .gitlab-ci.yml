# workflow:rules decides whether a pipeline is created *at all*. The rules are
# evaluated top to bottom and the first match wins; if nothing matches, the push
# produces no pipeline. Only "always" and "never" are meaningful here, and a rule
# without an explicit "when" defaults to "always".
#
# Which jobs then run inside that pipeline is decided separately, by the rules on
# each individual job.
workflow:
  rules:
    # Tag pushes. $CI_COMMIT_TAG is set only on tag pipelines, and this is the
    # release pipeline: validate_release and publish_helm select on the same
    # variable. Spelled out because this entry used to read "when: never", which
    # suppressed tag pipelines completely and made a tag-driven release impossible.
    # With the catch-all below it is now documentation rather than a real gate.
    - if: $CI_COMMIT_TAG
    # Everything else - branch pushes and merge requests - still gets a pipeline,
    # but only the validation and test jobs are selected in it; nothing publishes.
    - when: always

.common-config: &common-config
 - |
   chart_file="Chart.yaml"
   chart_name=$(grep '^name:' Chart.yaml | awk '{print $2}')
   helm_user="helm"
   helm_repo_name="search-guard-flx-helm-charts"

   if [[ -z "${CI_PROJECT_ID}" ]]; then
     helm_project_id=261
   else
     helm_project_id="${CI_PROJECT_ID}"
   fi
      
   if [[ -z "${CI_SERVER_HOST}" ]]; then
    server_host=git.floragunn.com
   else
    server_host="${CI_SERVER_HOST}"
   fi
            
   helm_channel=stable
   helm_repo_url=https://${server_host}/api/v4/projects/$helm_project_id/packages/helm/$helm_channel
   if [ ! -f "$chart_file" ]; then
    echo "[ERROR] Chart file $chart_file not exist"
    exit 1
   fi
   # On a release pipeline the tag is the source of truth for the version and for
   # the mode. Chart.yaml is stamped from it in publish_helm, so whatever is
   # currently committed there is only a fallback for non-tag pipelines.
   #
   #   4.1.2-flx       -> release_mode=release, chart_version=4.1.2
   #                      publishes to the helm repo, commits to $RELEASE_BRANCH
   #   4.1.2-flx-test  -> release_mode=test,    chart_version=4.1.2
   #                      publishes nothing,    commits to $TEST_BRANCH
   #
   # The case is fail-closed on purpose: an unrecognised tag aborts rather than
   # falling through to the publishing path.
   if [ -n "${CI_COMMIT_TAG}" ]; then
     case "${CI_COMMIT_TAG}" in
       *-flx-test)
         release_mode="test"
         chart_version="${CI_COMMIT_TAG%-flx-test}"
         ;;
       *-flx)
         release_mode="release"
         chart_version="${CI_COMMIT_TAG%-flx}"
         ;;
       *)
         echo "[ERROR] Tag ${CI_COMMIT_TAG} is neither <version>-flx nor <version>-flx-test"
         exit 1
         ;;
     esac
   else
     release_mode="none"
     chart_version=$(grep '^version:' $chart_file | awk -F ': ' '{print $2}')
   fi
   # Resolved configuration, echoed so a job log is self-contained when debugging.
   # Never echo $access_token or the origin URL it is embedded in.
   echo "[INFO] ===== Resolved CI configuration ====="
   echo "[INFO] helm            : $(helm version --short 2>/dev/null)"
   echo "[INFO] chart_file      : $chart_file"
   echo "[INFO] chart_name      : $chart_name"
   echo "[INFO] chart_version   : $chart_version"
   echo "[INFO] release_mode    : $release_mode"
   echo "[INFO] commit tag      : ${CI_COMMIT_TAG:-<none, not a tag pipeline>}"
   echo "[INFO] commit sha      : ${CI_COMMIT_SHA:-<none>}"
   echo "[INFO] project path    : ${CI_PROJECT_PATH:-<none>}"
   echo "[INFO] server host     : $server_host"
   echo "[INFO] helm repo name  : $helm_repo_name"
   echo "[INFO] helm repo url   : $helm_repo_url"
   echo "[INFO] ====================================="

   if helm repo list | grep -q "$helm_repo_name"; then
     echo "[INFO] Removing already registered helm repo $helm_repo_name"
     helm repo remove $helm_repo_name
   fi

   echo "[INFO] Adding helm repo $helm_repo_name -> $helm_repo_url"
   helm repo add --username $helm_user --password $access_token $helm_repo_name  $helm_repo_url
   echo "[INFO] Updating helm repo index"
   helm repo update
   echo "[INFO] Registered helm repos:"
   helm repo list
           
      
image: 
  name: alpine/helm:4.2.3
  entrypoint: [""]   
  

variables:
  GIT_STRATEGY: clone   
  
stages:
  - Validate
  - Publish
  - Test

# Proves the chart still renders. Runs in *every* pipeline - branches, merge
# requests and tags - and is a prerequisite of publish_helm.
#
# It renders the chart twice over:
#   1. with the defaults from values.yaml
#   2. once per examples/**/values.yaml overlay, so a broken example is caught too
#
# This is purely a templating check: it proves the Go templates expand and produce
# syntactically valid YAML. It does not contact a cluster and does not check the
# manifests against the Kubernetes API schema, so a chart that renders here can
# still be rejected by kubectl. Verifying that the cluster actually comes up is
# the job of integration_minikube.
validate_helm:
  tags:
    - build
  stage: Validate
  script:

    - |
      set -e
      echo "[INFO] helm: $(helm version --short 2>/dev/null)"
      echo "[INFO] ===== Rendering chart with default values ====="
      # Only stdout is discarded: helm's own error goes to stderr and stays in the
      # job log, so a failure below says what actually went wrong.
      if ! helm template . > /dev/null; then
          echo "[ERROR] Helm template cannot be rendered for default values"
          exit 1
      fi
      echo "[INFO]   OK: default values"

      # Both spellings, otherwise an overlay named values.yml is silently skipped.
      examples_list=$(find examples \( -name values.yaml -o -name values.yml \) | sort)
      echo "[INFO] ===== Rendering chart with $(echo "$examples_list" | wc -l | tr -d ' ') example overlays ====="
      for custom_value in $examples_list ; do
        echo "[INFO] Rendering with $custom_value"
        if ! helm template . -f $custom_value > /dev/null; then
          echo "[ERROR] Helm template cannot be rendered with $custom_value values"
          exit 1
        fi
        echo "[INFO]   OK: $custom_value"
      done
      echo "[INFO] Validation completed successfully"

# Checks that a release is safe to publish, before publish_helm does anything
# irreversible. Runs *only* on tag pipelines, so branches and merge requests skip
# it entirely.
#
# Two guards, either of which aborts the pipeline:
#   1. the tag is well-formed. The released version and the mode are derived from
#      the tag (see .common-config) and the version is stamped into Chart.yaml by
#      publish_helm, so a malformed tag would produce a wrongly versioned chart.
#   2. that version has not been published before. The helm repo is append-only
#      in practice, so re-publishing an existing version would either be rejected
#      or overwrite an already released chart.
#
# Both guards also run for "-flx-test" tags, so a test run is a faithful rehearsal
# of the real thing. Since test mode never publishes, testing 4.1.3-flx-test and
# then releasing 4.1.3-flx both pass guard 2.
validate_release:
  tags:
    - build
  stage: Validate
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - *common-config
    - |
      set -e
      # Guard 1: the tag defines the released version and the mode. It must look
      # like "4.1.2-flx" for a real release or "4.1.2-flx-test" for a test run.
      echo "[INFO] ===== Guard 1: tag format ====="
      echo "[INFO] Checking tag '$CI_COMMIT_TAG' against ^[0-9]+\.[0-9]+\.[0-9]+-flx(-test)?$"
      if ! echo "$CI_COMMIT_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-flx(-test)?$'; then
        echo "[ERROR] Tag $CI_COMMIT_TAG has an unexpected format"
        echo "[ERROR] Expected <major>.<minor>.<patch>-flx        for a release, e.g. 4.1.2-flx"
        echo "[ERROR]       or <major>.<minor>.<patch>-flx-test   for a test run, e.g. 4.1.2-flx-test"
        exit 1
      fi
      echo "[INFO]   OK: tag $CI_COMMIT_TAG -> chart version $chart_version, mode: $release_mode"
      if [ "$release_mode" = "test" ]; then
        echo "[INFO]   This is a TEST run: nothing will be published to $helm_repo_url"
      else
        echo "[INFO]   This is a REAL release: the chart will be published to $helm_repo_url"
      fi

      # Guard 2: refuse to republish a version that is already in the helm repo.
      # "helm search repo" prints "[]" as JSON when nothing matches the version.
      echo "[INFO] ===== Guard 2: version not published yet ====="
      echo "[INFO] Searching $helm_repo_name for version $chart_version"
      chart_exist=$(helm search repo  $helm_repo_name -o json --version $chart_version)
      echo "[INFO] Search result: $chart_exist"
      if [ ! "$chart_exist" == "[]" ]; then
        echo "[ERROR] Version $chart_version already exist in $helm_repo_url"
        echo "[ERROR] Publishing it again would overwrite an already released chart."
        echo "[ERROR] Tag a new version instead."
        exit 1
      fi
      echo "[INFO]   OK: version $chart_version is not published yet"

      echo "[INFO] Validation completed successfully"

publish_helm:
  needs:
    - validate_helm
    - validate_release
  rules:
    - if: $CI_COMMIT_TAG
  tags:
    - build
  stage: Publish
  variables:
    # Branch that carries the version bump produced by a real release.
    RELEASE_BRANCH: main
    # Scratch branch used by test runs. It is rebuilt from the tagged commit on
    # every test run, so anything previously on it is discarded.
    TEST_BRANCH: test
  script:
    - *common-config
    - |
      set -e
      echo "[INFO] ===== Installing the cm-push helm plugin ====="
      if helm plugin list | grep -q "cm-push"; then
        echo "[INFO] cm-push is already installed:"
        helm plugin list
      else
        # Helm 4 verifies plugin signatures by default. chartmuseum/helm-push is
        # installed straight from its git repository and ships no signature, so
        # verification has to be switched off or the install fails with
        # "plugin source does not support verification".
        echo "[INFO] Installing cm-push from https://github.com/chartmuseum/helm-push"
        helm plugin install --verify=false https://github.com/chartmuseum/helm-push
        echo "[INFO] Installed plugins:"
        helm plugin list
      fi

      echo "[INFO] ===== Publishing $CI_COMMIT_TAG (version $chart_version, mode $release_mode) ====="

      # Stamp the version extracted from the tag into Chart.yaml before packaging,
      # so the packaged chart always carries exactly the tagged version.
      echo "[INFO] ===== Stamping the version into $chart_file ====="
      echo "[INFO] $chart_file before:"
      grep '^version:' "$chart_file" | sed 's/^/[INFO]   /'
      sed -i "s|^version:.*|version: ${chart_version}|" "$chart_file"
      echo "[INFO] $chart_file after:"
      grep '^version:' "$chart_file" | sed 's/^/[INFO]   /'
      echo "[INFO] Full diff against the tagged commit:"
      git --no-pager diff -- "$chart_file" | sed 's/^/[INFO]   /'

      echo "[INFO] ===== Packaging the chart ====="
      helm package .
      echo "[INFO] Packaged artifacts in $(pwd):"
      ls -l *.tgz | sed 's/^/[INFO]   /'

      # The only step a test run skips: nothing ever reaches the helm repo.
      if [ "$release_mode" = "release" ]; then
        echo "[INFO] ===== Pushing the chart to $helm_repo_name ====="
        echo "[INFO] helm cm-push $chart_name-$chart_version.tgz $helm_repo_name ($helm_repo_url)"
        helm cm-push  $chart_name-$chart_version.tgz $helm_repo_name
        echo "[INFO] Published version $chart_version to $helm_repo_name"
        echo "[INFO] Verifying it is now visible in the repo index:"
        helm repo update > /dev/null
        helm search repo $helm_repo_name --version $chart_version | sed 's/^/[INFO]   /'
      else
        echo "[INFO] ===== TEST MODE: not pushing anything ====="
        echo "[INFO] Skipping: helm cm-push $chart_name-$chart_version.tgz $helm_repo_name"
        echo "[INFO] Nothing has been published to $helm_repo_url"
        echo "[INFO] The packaged chart is kept as a job artifact for inspection:"
        ls -l $chart_name-$chart_version.tgz | sed 's/^/[INFO]   /'
        echo "[INFO] Chart.yaml as packaged:"
        tar -xOf $chart_name-$chart_version.tgz $chart_name/Chart.yaml 2>/dev/null | sed 's/^/[INFO]   /' || true
      fi

      # Commit the stamped version back. A tag pipeline runs on a detached HEAD, so
      # restore the working tree, check the target branch out explicitly and re-apply
      # the change there.
      echo "[INFO] ===== Committing the version back to git ====="
      git config --global user.name "${GITLAB_USER_NAME:-gitlab-ci}"
      git config --global user.email "${GITLAB_USER_EMAIL:-noreply@floragunn.com}"
      echo "[INFO] Committing as $(git config --global user.name) <$(git config --global user.email)>"
      # The token is embedded in this URL, so it is deliberately never echoed.
      git remote set-url origin https://helm:$access_token@${server_host}/${CI_PROJECT_PATH}.git
      echo "[INFO] Restoring $chart_file to the tagged state before switching branches"
      git checkout -- "$chart_file"

      if [ "$release_mode" = "release" ]; then
        # Real release: add the version bump on top of the release branch.
        target_branch="$RELEASE_BRANCH"
        echo "[INFO] Release mode: committing on top of '$target_branch'"
        echo "[INFO] Fetching origin/$target_branch"
        git fetch origin "+refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
        git checkout -B "$target_branch" "refs/remotes/origin/${target_branch}"
        force_push=""
      else
        # Test run: rebuild the scratch branch from the tagged commit, so every
        # rehearsal is a clean reproduction instead of drifting run after run.
        target_branch="$TEST_BRANCH"
        echo "[INFO] Test mode: rebuilding scratch branch '$target_branch' from $CI_COMMIT_SHA"
        echo "[INFO] Anything previously on '$target_branch' will be discarded"
        git checkout -B "$target_branch" "$CI_COMMIT_SHA"
        force_push="--force"
      fi
      echo "[INFO] Now on: $(git rev-parse --abbrev-ref HEAD) at $(git rev-parse --short HEAD)"

      sed -i "s|^version:.*|version: ${chart_version}|" "$chart_file"

      if git diff --quiet -- "$chart_file"; then
        echo "[INFO] $chart_file is already at $chart_version, no version commit needed"
      else
        echo "[INFO] Staging the version change:"
        git --no-pager diff -- "$chart_file" | sed 's/^/[INFO]   /'
        git add "$chart_file"
        # [ci skip] keeps this push from starting another pipeline.
        git commit -m "Set chart version to $chart_version for $CI_COMMIT_TAG [ci skip]"
        echo "[INFO] Created commit $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
      fi

      echo "[INFO] Pushing HEAD to $target_branch ${force_push:+(force)}"
      git push $force_push origin "HEAD:${target_branch}"
      echo "[INFO] Updated $target_branch to version $chart_version"
      echo "[INFO] ===== Summary ====="
      echo "[INFO] tag            : $CI_COMMIT_TAG"
      echo "[INFO] mode           : $release_mode"
      echo "[INFO] chart version  : $chart_version"
      echo "[INFO] published      : $([ "$release_mode" = "release" ] && echo "yes -> $helm_repo_url" || echo "no (test run)")"
      echo "[INFO] branch updated : $target_branch"
      echo "[INFO] Completed successfully"
  artifacts:
    name: "$CI_COMMIT_TAG"
    paths:
      - "*.tgz"
    expire_in: 30 days

integration_minikube:
  stage: Test
  tags:
    - test-large
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    #- if: $CI_COMMIT_BRANCH == "ci/integration-minikube-tests-v2"
    - if: $RUN_MINIKUBE_TESTS == "true"
  variables:
    # Built from gh/docker-images (alpine-minikube/): ships dockerd,
    # minikube, kubectl, helm and the tools used by tests/*.sh.
    # The tag is updated automatically by the docker-images pipeline.
    SG_MINIKUBE_IMAGE: "floragunncom/alpine-minikube:260612"
    MINIKUBE_PROFILE: "multinode"
    MINIKUBE_K8S_VERSION: "v1.34.1"
    TEST_NS: "integtests"
  image:
    name: $SG_MINIKUBE_IMAGE
    entrypoint: [""]
  script:
    - |
      set -euo pipefail
      # Run dockerd inside the job container (privileged runner). The minikube
      # docker driver does not work against a remote DinD daemon because it
      # provisions the node via ports published on 127.0.0.1 of the daemon
      # host. With a local daemon those ports are reachable directly.
      # Prefer a data-root on a non-overlay filesystem (overlay2 cannot run
      # on top of overlayfs; fuse-overlayfs is the fallback).
      DOCKER_DATA_ROOT="/var/lib/docker"
      if [ "$(stat -f -c %T /builds 2>/dev/null)" != "overlayfs" ]; then
        DOCKER_DATA_ROOT="/builds/docker-data"
      fi
      # cgroup v2: move job processes out of the root cgroup and enable
      # subtree controllers, otherwise runc fails with "cannot enter
      # cgroupv2 /sys/fs/cgroup/docker" (same bootstrap as docker:dind).
      if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
        mkdir -p /sys/fs/cgroup/init
        xargs -rn1 < /sys/fs/cgroup/cgroup.procs > /sys/fs/cgroup/init/cgroup.procs || true
        sed -e 's/ / +/g' -e 's/^/+/' < /sys/fs/cgroup/cgroup.controllers \
          > /sys/fs/cgroup/cgroup.subtree_control || true
      fi

      echo "[INFO] Starting dockerd with data-root $DOCKER_DATA_ROOT"
      dockerd --data-root "$DOCKER_DATA_ROOT" > /var/log/dockerd.log 2>&1 &

      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 2
      done
      if ! docker info >/dev/null 2>&1; then
        echo "[ERROR] dockerd did not start"
        tail -n 100 /var/log/dockerd.log
        exit 1
      fi
      docker info | grep -E "Storage Driver|Cgroup" || true

      # Ensure minikube uses the docker driver.
      minikube config set driver docker -p "$MINIKUBE_PROFILE"

      # Start cluster and align kubectl context with what install.sh expects (multinode).
      ./tests/prepare_minikube.sh "$MINIKUBE_K8S_VERSION"
      kubectl config use-context "$MINIKUBE_PROFILE"

      # Run integration tests with default script arguments.
      ./tests/run_tests.sh
  after_script:
    - |
      echo "[INFO] Integration test diagnostics"
      if [ "${CI_JOB_STATUS:-success}" = "success" ]; then
        echo "[INFO] Job succeeded - skipping pod log collection"
        exit 0
      fi

      mkdir -p ci-artifacts
      kubectl config current-context || true
      helm status sg-elk -n "$TEST_NS" || true
      kubectl get po -A | tee ci-artifacts/pods-state.txt || true
      kubectl get pods -A -o wide | tee ci-artifacts/pods-wide.txt || true
      kubectl get events -A --sort-by=.metadata.creationTimestamp | tail -n 1000 > ci-artifacts/events.txt || true

      # Collect descriptions and logs for all pods/containers as artifacts.
      while IFS=$'\t' read -r ns pod; do
        [ -z "$ns" ] && continue
        [ -z "$pod" ] && continue
        safe_ns="$(echo "$ns" | tr '/ ' '__')"
        safe_pod="$(echo "$pod" | tr '/ ' '__')"

        kubectl -n "$ns" describe pod "$pod" > "ci-artifacts/${safe_ns}_${safe_pod}_describe.txt" || true

        for c in $(kubectl -n "$ns" get pod "$pod" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
          kubectl -n "$ns" logs "$pod" -c "$c" > "ci-artifacts/${safe_ns}_${safe_pod}_${c}.log" || true
          kubectl -n "$ns" logs "$pod" -c "$c" --previous > "ci-artifacts/${safe_ns}_${safe_pod}_${c}_previous.log" || true
        done

        for c in $(kubectl -n "$ns" get pod "$pod" -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null); do
          kubectl -n "$ns" logs "$pod" -c "$c" > "ci-artifacts/${safe_ns}_${safe_pod}_${c}.log" || true
          kubectl -n "$ns" logs "$pod" -c "$c" --previous > "ci-artifacts/${safe_ns}_${safe_pod}_${c}_previous.log" || true
        done
      done < <(kubectl get pods -A --no-headers -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name' | awk '{print $1 "\t" $2}')
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - ci-artifacts/


