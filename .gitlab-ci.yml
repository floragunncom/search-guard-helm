workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
    
.common-config: &common-config
 - |
   git config --global user.name "${GITLAB_USER_NAME}"
   git config --global user.email "${GITLAB_USER_EMAIL}"  
   chart_file="Chart.yaml"
   chart_name=$(grep '^name:' Chart.yaml | awk '{print $2}')
   helm_user="helm"
   helm_repo_name="search-guard-flx-helm-charts"

   if [[ -z "${CI_PROJECT_ID}" ]]; then
     helm_project_id=261
   else
     helm_project_id="${CI_PROJECT_ID}"
   fi
      
   if [[ -z "${CI_SERVER_HOST}" ]]; then
    server_host=git.floragunn.com
   else
    server_host="${CI_SERVER_HOST}"
   fi
            
   helm_channel=stable
   helm_repo_url=https://${server_host}/api/v4/projects/$helm_project_id/packages/helm/$helm_channel 
   git remote set-url origin https://helm:$access_token@${server_host}/${CI_PROJECT_PATH}.git
   chart_version=$(grep '^version:' $chart_file | awk -F ': ' '{print $2}')
   if [ ! -f "$chart_file" ]; then
    echo "[ERROR] Chart file $chart_file not exist"
    exit 1
   fi 
   if helm repo list | grep -q "$helm_repo_name"; then
     helm repo remove $helm_repo_name
   fi    
          
   helm repo add --username $helm_user --password $access_token $helm_repo_name  $helm_repo_url
   helm repo update
           
      
image: 
  name: alpine/helm:3.18.3
  entrypoint: [""]   
  

variables:
  GIT_STRATEGY: clone   
  
stages:
  - Validate
  - Publish
  - Test

validate_helm:
  tags:
    - build    
  stage: Validate
  script:

    - |
      set -e
      if ! helm template . > /dev/null 2>&1; then
          echo "[ERROR] Helm template cannot be rendered for default values"
          exit 1      
      fi
      for custom_value in $(find examples -name values.yaml) ; do
        if ! helm template . -f $custom_value > /dev/null 2>&1; then
          echo "[ERROR] Helm template cannot be rendered with $custom_value values"
          exit 1
        fi
      done
      echo "[INFO] Validation completed successfully"

validate_release:
  tags:
    - build  
  stage: Validate
  script:
    - *common-config  
    - |
      set -e
      if git tag -l | grep -q "^$chart_version$"; then
        echo "[ERROR] Tag for version $chart_version already exist"
        exit 1
      fi
      
      chart_exist=$(helm search repo  $helm_repo_name -o json --version $chart_version) 
      if [ ! "$chart_exist" == "[]" ]; then
       echo "[ERROR] Version $chart_version already exist in $helm_repo_url"
      fi
      
      echo "[INFO] Validation completed successfully"
publish_helm:
  needs:
    - validate_helm  
    - validate_release
  only:
    - main
  tags:
    - build  
  stage: Publish
  script:
    - *common-config  
    - |
      set -e
      if ! helm plugin list | grep -q "cm-push"; then
        helm plugin install https://github.com/chartmuseum/helm-push
      fi
      echo "[INFO] Executing helm package"
      helm package .  
      echo "[INFO] Executing helm cm-push"
      helm cm-push  $chart_name-$chart_version.tgz $helm_repo_name
      echo "[INFO] Published $chart_version version for $helm_repo_name"
                      
      git tag "$chart_version-flx"
      git push origin $chart_version-flx    
      echo "[INFO] Published tags"
      echo "[INFO] Completed successfully"

integration_kind:
  stage: Test
  tags:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    KIND_CLUSTER_NAME: "kind"
    KIND_K8S_VERSION: "v1.34.0"
    TEST_NS: "integtests"
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  image: ubuntu:24.04
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  script:
    - |
      set -euo pipefail
      apt-get update
      apt-get install -y --no-install-recommends \
        bash curl ca-certificates tar gzip procps \
        psmisc \
        netcat-openbsd \
        docker.io

      # Install Helm (scripts under tests/ call `helm`).
      if ! command -v helm >/dev/null 2>&1; then
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        export PATH="$PATH:/root/.local/bin"
      fi

      # kind (multi-node local Kubernetes)
      if ! command -v kind >/dev/null 2>&1; then
        curl -sLo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
        chmod +x /usr/local/bin/kind
      fi

      # kubectl might not exist in the base image; install if missing.
      if ! command -v kubectl >/dev/null 2>&1; then
        KUBECTL_VERSION="$(curl -s https://dl.k8s.io/release/stable.txt)"
        curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        chmod +x /usr/local/bin/kubectl
      fi

      # Start cluster and align kubectl context with what install.sh expects (kind-kind).
      ./tests/prepare_kind.sh "$KIND_K8S_VERSION" "$KIND_CLUSTER_NAME"
      kubectl config use-context "kind-kind"

      # Run integration tests with default script arguments.
      ./tests/run_tests.sh
  after_script:
    - |
      echo "[INFO] Integration test diagnostics"
      if [ "${CI_JOB_STATUS:-success}" = "success" ]; then
        echo "[INFO] Job succeeded - skipping pod log collection"
        exit 0
      fi

      mkdir -p ci-artifacts
      kubectl config current-context || true
      helm status sg-elk -n "$TEST_NS" || true
      kubectl get po -A | tee ci-artifacts/pods-state.txt || true
      kubectl get pods -A -o wide | tee ci-artifacts/pods-wide.txt || true
      kubectl get events -A --sort-by=.metadata.creationTimestamp | tail -n 1000 > ci-artifacts/events.txt || true

      # Collect descriptions and logs for all pods/containers as artifacts.
      while IFS=$'\t' read -r ns pod; do
        [ -z "$ns" ] && continue
        [ -z "$pod" ] && continue
        safe_ns="$(echo "$ns" | tr '/ ' '__')"
        safe_pod="$(echo "$pod" | tr '/ ' '__')"

        kubectl -n "$ns" describe pod "$pod" > "ci-artifacts/${safe_ns}_${safe_pod}_describe.txt" || true

        for c in $(kubectl -n "$ns" get pod "$pod" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
          kubectl -n "$ns" logs "$pod" -c "$c" > "ci-artifacts/${safe_ns}_${safe_pod}_${c}.log" || true
          kubectl -n "$ns" logs "$pod" -c "$c" --previous > "ci-artifacts/${safe_ns}_${safe_pod}_${c}_previous.log" || true
        done

        for c in $(kubectl -n "$ns" get pod "$pod" -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null); do
          kubectl -n "$ns" logs "$pod" -c "$c" > "ci-artifacts/${safe_ns}_${safe_pod}_${c}.log" || true
          kubectl -n "$ns" logs "$pod" -c "$c" --previous > "ci-artifacts/${safe_ns}_${safe_pod}_${c}_previous.log" || true
        done
      done < <(kubectl get pods -A --no-headers -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name' | awk '{print $1 "\t" $2}')
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - ci-artifacts/


